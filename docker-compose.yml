services:
  # Сервис базы данных
  postgres-db:
    image: postgres:17-alpine
    container_name: db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d db"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Сервис вашего Spring-приложения
  spring-app:
    build: .
    container_name: FootballBase_app
    ports:
      - "8080:8080"
    environment:
      # Переопределяем настройки подключения к БД для контейнера
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
